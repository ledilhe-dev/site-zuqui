name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar e preparar site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validar projeto modular
        run: python tools/verify_modularization.py

      - name: Validar versão única do conector
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import json; print(json.load(open('assets/connector-version.json', encoding='utf-8'))['latest_version'])")
          test "$(find downloads -maxdepth 1 -type f -name 'Conector-Raffinato-v*.exe' | wc -l)" -eq 1
          test -f "downloads/Conector-Raffinato-v${version}.exe"
          test -f "downloads/Conector-Raffinato-v${version}.sha256.txt"
          (cd downloads && sha256sum -c "Conector-Raffinato-v${version}.sha256.txt")

      - name: Montar artefato público
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          cp index.html _site/
          cp config.js _site/
          cp manifest.webmanifest _site/
          cp service-worker-v4.js _site/
          cp CNAME _site/
          cp favicon-check-diario.svg _site/
          cp logo-check-diario.svg _site/
          cp icon-192.png _site/
          cp icon-512.png _site/
          cp -R assets _site/
          cp -R media _site/
          cp -R zuqui _site/
          mkdir -p _site/downloads
          cp downloads/Conector-Raffinato-v2.0.13.exe _site/downloads/
          cp downloads/Conector-Raffinato-v2.0.13.sha256.txt _site/downloads/

          touch _site/.nojekyll

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
