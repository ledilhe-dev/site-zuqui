<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width">
  <title>Teste visual comparativo anual</title>
  <link rel="stylesheet" href="../assets/css/109-theme-contrast.css">
  <link rel="stylesheet" href="../assets/css/114-annual-comparison.css">
  <style>:root{--surface:#111827;--text:#f8fafc;--text-muted:#94a3b8;--border:#334155}body{margin:0;padding:24px;background:#0b1220;color:var(--text);font-family:Arial}.annual-report-page{max-width:1500px;margin:auto}.card,.ar-chart{padding:22px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.ar-selection{margin-top:10px}.ar-chart{margin-top:14px}</style>
</head>
<body><main class="annual-report-page">
  <div class="card ar-filters">
    <label>Anos<details class="ar-multiselect" open><summary id="arYearsSummary">2023, 2024, 2025 e 2026</summary><div class="ar-multiselect-panel"><div class="ar-multiselect-actions"><button>Marcar todos</button><button>Limpar</button></div><div id="arYearsOptions" class="ar-multiselect-options"><label><input type="checkbox" value="2023" checked> 2023</label><label><input type="checkbox" value="2024" checked> 2024</label><label><input type="checkbox" value="2025" checked> 2025</label><label><input type="checkbox" value="2026" checked> 2026</label></div></div></details></label>
    <label>Módulos<details class="ar-multiselect"><summary id="arModulesSummary">Todos os módulos</summary><div class="ar-multiselect-panel"><div id="arModulesOptions"><input type="checkbox" value="VENDA_RAPIDA" checked><input type="checkbox" value="DELIVERY" checked></div></div></details></label>
    <label>Tipo de Documento<details class="ar-multiselect"><summary id="arIssuanceSummary">Todos os documentos</summary><div class="ar-multiselect-panel"><div id="arIssuanceOptions"><input type="checkbox" value="CONTINGENCIA" checked><input type="checkbox" value="SEM_CONTINGENCIA" checked></div></div></details></label>
    <label>Agrupamentos<details class="ar-multiselect"><summary id="arGroupsSummary">Todos os agrupamentos</summary><div class="ar-multiselect-panel"><div id="arGroupsOptions"></div></div></details></label>
  </div>
  <div class="ar-selection"><strong>Analisando:</strong><div><button>2023</button><button>2024</button><button>2025</button><button>2026</button></div><button>Limpar tudo</button></div>
  <div class="ar-kpis"><article><span>Faturamento</span><strong>R$ 1.379.916,92</strong><small>Comparativo equivalente</small></article><article><span>Variação</span><strong class="positive">+12,45%</strong></article></div>
  <article class="ar-chart"><div id="arFiscalComparison"></div></article>
  <article class="ar-chart"><div id="arAnnualComparison"></div></article>
  <div class="ar-hidden-selects"><select id="arIssuance"><option value="TODOS" selected>Todos</option></select></div>
</main>
<script>window.registrarModuloTenantScoped=()=>{};window.contextoRaffinato=()=>({});</script>
<script src="../assets/js/38-annual-comparison.js"></script>
<script>
arHistory={primeira_data:'2023-10-29'};arSelected={ano:2026,mes:null};
const years=[2023,2024,2025,2026];
arSummary={meses:years.flatMap((ano,yi)=>Array.from({length:12},(_,i)=>{const total=Math.max(0,55000+(i*9000)+(yi*17000)+Math.sin(i*1.7+yi)*28000);return{ano,mes:i+1,faturamento:total,faturamento_contingencia:total*.38,faturamento_sem_contingencia:total*.62,vendas:60+i*4}}))};
document.getElementById('arFiscalComparison').innerHTML=arFiscalChart();
document.getElementById('arAnnualComparison').innerHTML=arLineChart(arSummary.meses);
</script></body></html>
